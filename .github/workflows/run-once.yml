name: 一次性测试-抖音热歌到网易云

on:
  push:
    paths:
      - ".github/workflows/run-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Run dry test
        env:
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          NETEASE_PLAYLIST_ID: ${{ secrets.NETEASE_PLAYLIST_ID }}
          TOP_N: "10"
          DRY_RUN: "true"
          MATCH_THRESHOLD: "0.68"
        run: python sync.py
